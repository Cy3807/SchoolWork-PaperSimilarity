name: checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install coverage ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python 3123004519/tools/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            3123004519/reports/coverage.*
            3123004519/reports/tests.*
            3123004519/reports/htmlcov/
